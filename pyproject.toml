[tool.poetry]
name = "alpyca"
version = "3.1.3"
description = "API library for all ASCOM Alpaca devices, management, and discovery"
authors = ["Robert B. Denny <rdenny@dc3.com>"]
license = "LICENSE"
readme = "README.md"
documentation = "https://ascom-standards.org/alpyca/index.html"
repository = "https://github.com/ASCOMInitiative/alpyca"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Astronomy"
]
packages = [
	{include = "alpaca"}
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/ASCOMInitiative/alpyca/issues"
"ASCOM Initiative" = "https://ascom-standards.org/"
"ASCOM Developer Forum" = "https://ascomtalk.groups.io/g/Developer/"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.5"
typing-extensions = "^4.15.0"
python-dateutil = "^2.8.2"
enum-tools = "0.*"
ifaddr = "^0.2.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytz = "^2025.2"

[tool.pytest.ini_options]
minversion = "9.1"
addopts = "--setup-show -rA"
testpaths = [
    "PyTest"
]

[tool.rstcheck]
ignore_directives = [
    "autoclass",
    "automodule",
    "autofunction",
    "autoenum"
]
ignore_messages = [
    "Hyperlink target .* is not referenced"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
